# MainのSWD RTT。書込み・リセット・CPU停止を行わずTCP 19030へ公開する。
bindto 127.0.0.1
gdb_port disabled
tcl_port disabled
telnet_port disabled
source [find interface/stlink.cfg]
if { [info exists MAIN_STLINK_SERIAL] } { adapter serial $MAIN_STLINK_SERIAL }
transport select hla_swd
source [find target/stm32g4x.cfg]
init
if { [info exists MAIN_RTT_ADDRESS] } {
    rtt setup $MAIN_RTT_ADDRESS 0x40 "SEGGER RTT"
} else {
    rtt setup 0x20000000 0x20000 "SEGGER RTT"
}
rtt polling_interval 5
rtt start
rtt server start 19030 0
